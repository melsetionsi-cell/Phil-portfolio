<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>ICT Portfolio · University</title>
  
  <!-- Font Awesome (icons) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  
  <style>
    /* ================= STYLE.CSS ================= */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    /* ===== COLORFUL ANIMATED BACKGROUND ===== */
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 25%, #f093fb 50%, #f5576c 75%, #fda085 100%);
      background-size: 400% 400%;
      animation: gradientShift 18s ease infinite, bodyFade 0.9s ease-out forwards;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      opacity: 0;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes bodyFade {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }

    .portfolio-card {
      max-width: 1100px;
      width: 100%;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 3.5rem;
      padding: 2.8rem 2.5rem;
      box-shadow: 0 30px 60px -15px rgba(80, 20, 120, 0.35),
                  inset 0 1px 2px rgba(255, 255, 255, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.9);
      transition: transform 0.3s ease, box-shadow 0.4s ease;
      animation: cardAppear 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      transform: translateY(20px);
      opacity: 0;
    }

    @keyframes cardAppear {
      0% { opacity: 0; transform: translateY(30px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .portfolio-card:hover {
      box-shadow: 0 40px 70px -18px rgba(120, 40, 180, 0.45),
                  inset 0 1px 4px rgba(255, 255, 255, 0.9);
    }

    /* ----- header / avatar ----- */
    .profile-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 2rem;
      margin-bottom: 2.5rem;
    }

    .avatar-wrapper {
      flex-shrink: 0;
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea, #764ba2, #f093fb);
      background-size: 200% 200%;
      animation: avatarGlow 6s ease infinite;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      box-shadow: 0 18px 30px -8px rgba(118, 75, 162, 0.55);
      border: 4px solid #ffffff;
      transition: transform 0.4s ease, box-shadow 0.4s ease;
    }

    @keyframes avatarGlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .avatar-wrapper:hover {
      transform: scale(1.04);
      box-shadow: 0 24px 38px -8px rgba(118, 75, 162, 0.7);
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
      transition: transform 0.4s ease;
    }

    .avatar-wrapper:hover .avatar-img {
      transform: scale(1.08);
    }

    .avatar-icon {
      font-size: 4.8rem;
      color: white;
      filter: drop-shadow(0 6px 10px rgba(0,0,0,0.25));
    }

    .title-section {
      flex: 1;
    }

    .gradient-name {
      font-size: 2.9rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 0.3rem;
      background: linear-gradient(90deg, #667eea, #764ba2, #f5576c, #f093fb, #667eea);
      background-size: 300% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
      animation: textShine 6s linear infinite;
    }

    @keyframes textShine {
      0% { background-position: 0% 50%; }
      100% { background-position: 300% 50%; }
    }

    .title-section .uni-badge {
      display: inline-block;
      background: linear-gradient(135deg, #667eea20, #f093fb20);
      backdrop-filter: blur(4px);
      padding: 0.4rem 1rem;
      border-radius: 60px;
      font-size: 0.9rem;
      font-weight: 600;
      color: #6d28d9;
      border: 1px solid #a78bfa70;
      margin-bottom: 0.8rem;
    }

    .title-section .subhead {
      font-size: 1.15rem;
      color: #5b4b7a;
      font-weight: 400;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .title-section .subhead i {
      color: #7c3aed;
      font-size: 1rem;
    }

    #randomMajor {
      background: linear-gradient(135deg, #f093fb, #f5576c);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 700;
    }

    /* ----- random quote ----- */
    .random-quote {
      background: linear-gradient(135deg, rgba(102, 126, 234, 0.12), rgba(240, 147, 251, 0.12));
      border-radius: 2.5rem;
      padding: 1rem 1.5rem;
      margin-bottom: 2.2rem;
      display: flex;
      align-items: center;
      gap: 0.8rem;
      border-left: 6px solid #764ba2;
      transition: background 0.3s ease, transform 0.3s ease;
    }

    .random-quote:hover {
      transform: translateX(4px);
      background: linear-gradient(135deg, rgba(102, 126, 234, 0.18), rgba(245, 87, 108, 0.18));
    }

    .random-quote i {
      font-size: 1.6rem;
      color: #7c3aed;
      opacity: 0.9;
    }

    .random-quote span {
      font-size: 1.05rem;
      font-weight: 500;
      color: #3d2b5c;
      font-style: italic;
      letter-spacing: 0.01em;
    }

    /* ----- info grid ----- */
    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2.5rem;
    }

    .info-tile {
      padding: 1.5rem 1.2rem;
      border-radius: 2rem;
      border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 10px 24px -12px rgba(80, 40, 120, 0.2);
      transition: transform 0.3s ease, box-shadow 0.35s ease, filter 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .info-tile::before {
      content: "";
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 5px;
      border-radius: 2rem 2rem 0 0;
    }

    .tile-purple {
      background: linear-gradient(150deg, rgba(237, 233, 254, 0.9), rgba(221, 214, 254, 0.7));
    }
    .tile-purple::before { background: linear-gradient(90deg, #667eea, #764ba2); }
    .tile-purple i { color: #7c3aed; }

    .tile-pink {
      background: linear-gradient(150deg, rgba(252, 231, 243, 0.9), rgba(251, 207, 232, 0.7));
    }
    .tile-pink::before { background: linear-gradient(90deg, #f093fb, #f5576c); }
    .tile-pink i { color: #db2777; }

    .tile-blue {
      background: linear-gradient(150deg, rgba(219, 234, 254, 0.9), rgba(191, 219, 254, 0.7));
    }
    .tile-blue::before { background: linear-gradient(90deg, #4facfe, #00c6ff); }
    .tile-blue i { color: #0284c7; }

    .info-tile:hover {
      transform: translateY(-8px) scale(1.01);
      box-shadow: 0 26px 34px -14px rgba(100, 50, 160, 0.35);
      filter: saturate(1.15);
    }

    .info-tile i {
      font-size: 1.8rem;
      margin-bottom: 0.75rem;
      transition: transform 0.3s ease;
    }

    .info-tile:hover i {
      transform: scale(1.15) rotate(-4deg);
    }

    .info-tile h3 {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 700;
      color: #6d28d9;
      margin-bottom: 0.4rem;
    }

    .tile-pink h3 { color: #be185d; }
    .tile-blue h3 { color: #0369a1; }

    .info-tile p {
      font-size: 1.2rem;
      font-weight: 600;
      color: #2d1b4e;
      line-height: 1.4;
      word-break: break-word;
    }

    .skill-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }

    .skill-tag {
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-radius: 40px;
      padding: 0.3rem 0.95rem;
      font-size: 0.8rem;
      font-weight: 600;
      color: #ffffff;
      box-shadow: 0 4px 10px -4px rgba(118, 75, 162, 0.6);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .skill-tag:nth-child(2n) {
      background: linear-gradient(135deg, #f093fb, #f5576c);
      box-shadow: 0 4px 10px -4px rgba(245, 87, 108, 0.6);
    }

    .skill-tag:nth-child(3n) {
      background: linear-gradient(135deg, #4facfe, #00c6ff);
      box-shadow: 0 4px 10px -4px rgba(0, 150, 255, 0.6);
    }

    .skill-tag:hover {
      transform: translateY(-3px) scale(1.05);
    }

    /* ----- CV BUTTON ----- */
    .cv-section {
      display: flex;
      justify-content: center;
      margin-top: 1.2rem;
      margin-bottom: 0.5rem;
    }

    .cv-btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 40%, #f5576c 100%);
      background-size: 200% 200%;
      color: white;
      border: none;
      padding: 1.2rem 3.2rem;
      border-radius: 80px;
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      display: inline-flex;
      align-items: center;
      gap: 0.9rem;
      cursor: pointer;
      box-shadow: 0 18px 30px -10px rgba(118, 75, 162, 0.65);
      transition: all 0.35s cubic-bezier(0.2, 0.9, 0.4, 1);
      border: 1px solid rgba(255, 255, 255, 0.3);
      animation: btnGradient 5s ease infinite, pulseShadow 2.5s infinite alternate;
    }

    @keyframes btnGradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes pulseShadow {
      0% { box-shadow: 0 18px 30px -10px rgba(118, 75, 162, 0.55); }
      100% { box-shadow: 0 24px 40px -8px rgba(245, 87, 108, 0.75); }
    }

    .cv-btn i {
      font-size: 1.5rem;
      transition: transform 0.3s ease;
    }

    .cv-btn:hover {
      transform: scale(1.04) translateY(-3px);
      filter: brightness(1.1) saturate(1.2);
    }

    .cv-btn:active {
      transform: scale(0.97);
    }

    .cv-btn:hover i {
      transform: translateY(2px);
    }

    /* ----- footer ----- */
    .footer-note {
      text-align: center;
      margin-top: 2.2rem;
      font-size: 0.8rem;
      color: #7c6a9a;
      letter-spacing: 0.3px;
      opacity: 0.85;
      border-top: 1px solid #e0d6f0;
      padding-top: 1.5rem;
    }

    /* ----- responsive adjustments ----- */
    @media (max-width: 700px) {
      body { padding: 0.8rem; }
      .portfolio-card { padding: 1.8rem 1.2rem; border-radius: 2.5rem; }
      .profile-header { flex-direction: column; text-align: center; gap: 1rem; }
      .avatar-wrapper { width: 110px; height: 110px; }
      .avatar-icon { font-size: 4rem; }
      .gradient-name { font-size: 2.1rem; }
      .title-section .subhead { justify-content: center; font-size: 1rem; }
      .random-quote { padding: 0.9rem 1.2rem; }
      .random-quote span { font-size: 0.95rem; }
      .cv-btn { padding: 1rem 2rem; font-size: 1.1rem; width: 100%; justify-content: center; }
      .info-grid { gap: 1rem; }
    }

    @media (max-width: 400px) {
      .portfolio-card { padding: 1.5rem 1rem; }
      .gradient-name { font-size: 1.8rem; }
      .info-tile p { font-size: 1rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="portfolio-card">
    <!-- header -->
    <div class="profile-header">
      <div class="avatar-wrapper">
        <!-- ============================================= -->
        <!-- 👇 INSERT YOUR PICTURE HERE 👇               -->
        <!-- Put your photo here named "profile.jpg",     -->
        <!-- or change the src to your image path.        -->
        <!-- ============================================= -->
        <img src="profile.jpg" alt="Alex Rivera" class="avatar-img"
             onerror="this.style.display='none'; document.getElementById('avatarFallback').style.display='flex';">
        <i id="avatarFallback" class="fas fa-user-graduate avatar-icon" style="display: none;"></i>
      </div>
      <div class="title-section">
        <div class="uni-badge"><i class="fas fa-university" style="margin-right: 6px;"></i> University of ICT</div>
        <h1 class="gradient-name">Alex Rivera</h1>
        <div class="subhead">
          <i class="fas fa-laptop-code"></i> ICT Student · 3rd year
          <i class="fas fa-circle" style="font-size: 0.5rem; color: #7c3aed; margin: 0 4px;"></i>
          <span id="randomMajor">Cybersecurity & Networks</span>
        </div>
      </div>
    </div>

    <!-- random quote -->
    <div class="random-quote">
      <i class="fas fa-quote-left"></i>
      <span id="quoteText">Loading inspiration...</span>
    </div>

    <!-- dynamic info tiles -->
    <div class="info-grid">
      <div class="info-tile tile-purple">
        <i class="fas fa-code"></i>
        <h3>Core Skills</h3>
        <div class="skill-tags" id="skillContainer">
          <!-- randomized skills will be injected here -->
        </div>
      </div>
      <div class="info-tile tile-pink">
        <i class="fas fa-certificate"></i>
        <h3>Certification</h3>
        <p id="certText">Cisco CCNA (in progress)</p>
      </div>
      <div class="info-tile tile-blue">
        <i class="fas fa-project-diagram"></i>
        <h3>Latest Project</h3>
        <p id="projectText">Smart Campus IoT Dashboard</p>
      </div>
    </div>

    <!-- CV BUTTON (download) -->
    <div class="cv-section">
      <button class="cv-btn" id="downloadCvBtn">
        <i class="fas fa-file-pdf"></i> Download CV
        <i class="fas fa-arrow-down" style="font-size: 1.2rem;"></i>
      </button>
    </div>

    <div class="footer-note">
      <i class="fas fa-sync-alt" style="margin-right: 6px;"></i> randomized portfolio · built with smooth animations
    </div>
  </main>

  <!-- ================= SCRIPT.JS ================= -->
  <script>
    (function() {
      "use strict";

      // ---------- RANDOMIZATION DATA ----------
      const quotes = [
        "Code is like humor. When you have to explain it, it’s bad.",
        "Innovation distinguishes between a leader and a follower.",
        "The best way to predict the future is to create it.",
        "Simplicity is the soul of efficiency.",
        "Learning never exhausts the mind.",
        "Talk is cheap. Show me the code.",
        "Security is not a product, but a process.",
        "The cloud is just someone else's computer.",
        "First, solve the problem. Then, write the code.",
        "Any sufficiently advanced technology is indistinguishable from magic."
      ];

      const majors = [
        "Cybersecurity & Networks",
        "Software Engineering",
        "Data Science",
        "Cloud Computing",
        "AI & Machine Learning",
        "Network Infrastructure",
        "Web & Mobile Development"
      ];

      const skillSets = [
        ["Python", "Java", "SQL", "Linux"],
        ["JavaScript", "React", "Node.js", "REST API"],
        ["Network Security", "Wireshark", "Firewalls", "VPN"],
        ["Cloud (AWS)", "Docker", "Kubernetes", "CI/CD"],
        ["Data Analysis", "Pandas", "TensorFlow", "Statistics"],
        ["HTML5/CSS3", "Figma", "UI/UX", "Responsive Design"],
        ["C#", ".NET", "Azure", "Git"],
        ["Ethical Hacking", "Pen Testing", "Cryptography"]
      ];

      const certifications = [
        "Cisco CCNA (in progress)",
        "CompTIA Security+ (expected 2026)",
        "AWS Cloud Practitioner",
        "Google IT Support",
        "Microsoft Azure Fundamentals",
        "Linux LPIC-1"
      ];

      const projects = [
        "Smart Campus IoT Dashboard",
        "E‑commerce Microservices",
        "Network Vulnerability Scanner",
        "Personal Portfolio v2",
        "Library Management System",
        "Chatbot with NLP",
        "Cloud File Storage App",
        "Campus Navigation AR"
      ];

      const randomItem = (arr) => arr[Math.floor(Math.random() * arr.length)];

      // ---------- UPDATE RANDOM CONTENT ----------
      function randomizeAll() {
        const majorEl = document.getElementById('randomMajor');
        if (majorEl) majorEl.textContent = randomItem(majors);

        const quoteEl = document.getElementById('quoteText');
        if (quoteEl) quoteEl.textContent = `“${randomItem(quotes)}”`;

        const skillContainer = document.getElementById('skillContainer');
        if (skillContainer) {
          const selectedSkills = randomItem(skillSets);
          const count = Math.random() > 0.5 ? 4 : 3;
          const shuffled = [...selectedSkills].sort(() => Math.random() - 0.5).slice(0, count);
          skillContainer.innerHTML = shuffled.map(skill => 
            `<span class="skill-tag">${skill}</span>`
          ).join('');
        }

        const certEl = document.getElementById('certText');
        if (certEl) certEl.textContent = randomItem(certifications);

        const projectEl = document.getElementById('projectText');
        if (projectEl) projectEl.textContent = randomItem(projects);
      }

      // ---------- CV DOWNLOAD ----------
      function downloadCV() {
        const name = "Alex Rivera";
        const title = "ICT Student · University of ICT";
        const email = "alex.rivera@student.ict.edu";
        const phone = "+1 (555) 782-3412";
        const education = "BSc in Information and Communication Technology, University of ICT (2023 – 2027 expected)";
        const projectsList = [
          "Smart Campus IoT Dashboard – real‑time sensor data with MQTT",
          "Network Vulnerability Scanner – automated pentesting toolkit",
          "Cloud File Storage – AWS S3 + Lambda backend"
        ];
        const certs = ["Cisco CCNA (in progress)", "AWS Cloud Practitioner (2026)", "CompTIA Security+ (expected)"];

        const cvContent = `
============================================
          CURRICULUM VITAE
============================================
${name}
${title}
📧 ${email}  |  📞 ${phone}

--------------------------------------------
PROFESSIONAL SUMMARY
--------------------------------------------
Motivated ICT student with a strong foundation in networking, 
programming, and cloud technologies. Passionate about cybersecurity 
and building scalable solutions. Quick learner and team player.

--------------------------------------------
EDUCATION
--------------------------------------------
${education}

--------------------------------------------
TECHNICAL SKILLS
--------------------------------------------
• Programming: Python, JavaScript, Java, SQL
• Networking: TCP/IP, Routing, Firewalls, Wireshark
• Cloud: AWS (EC2, S3, Lambda), Docker basics
• Web: React, Node.js, HTML5/CSS3, REST APIs
• Security: Vulnerability assessment, Cryptography basics
• Tools: Git, Linux, Figma, VS Code

--------------------------------------------
PROJECTS
--------------------------------------------
${projectsList.map(p => `• ${p}`).join('\n')}

--------------------------------------------
CERTIFICATIONS
--------------------------------------------
${certs.map(c => `• ${c}`).join('\n')}

--------------------------------------------
LANGUAGES
--------------------------------------------
English (fluent), Spanish (intermediate)

--------------------------------------------
References available upon request.
============================================
        `.trim();

        const blob = new Blob([cvContent], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = 'Alex_Rivera_CV.txt';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);

        const btn = document.getElementById('downloadCvBtn');
        if (btn) {
          btn.style.transform = 'scale(0.96)';
          setTimeout(() => { btn.style.transform = ''; }, 200);
        }
      }

      // ---------- INITIALIZATION ----------
      document.addEventListener('DOMContentLoaded', () => {
        randomizeAll();

        setInterval(() => {
          randomizeAll();
        }, 15000);

        const cvBtn = document.getElementById('downloadCvBtn');
        if (cvBtn) {
          cvBtn.addEventListener('click', (e) => {
            e.preventDefault();
            downloadCV();
          });
        }
      });
    })();
  </script>
</body>
</html>
